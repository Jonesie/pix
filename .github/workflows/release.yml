name: Release

# Builds a signed APK + a self-hostable site bundle and publishes both to a GitHub
# Release whenever a version tag (e.g. v1.2.0) is pushed.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set — see README for how to generate a release signing key." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../pix.apk

      - uses: actions/upload-artifact@v7
        with:
          name: pix.apk
          path: pix.apk
          retention-days: 1

  package-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Package self-hostable site bundle
        run: |
          mkdir -p dist/pix
          cp -r app static nginx docs dist/pix/
          cp requirements.txt Dockerfile docker-compose.yml .env.example install.sh README.md LICENSE dist/pix/
          echo "${GITHUB_REF_NAME#v}" > dist/pix/VERSION
          tar -czf pix-site.tar.gz -C dist pix

      - uses: actions/upload-artifact@v7
        with:
          name: pix-site.tar.gz
          path: pix-site.tar.gz
          retention-days: 1

  publish:
    needs: [build-apk, package-site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pix.apk

      - uses: actions/download-artifact@v8
        with:
          name: pix-site.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            pix.apk pix-site.tar.gz \
            --title "${{ github.ref_name }}" \
            --generate-notes
