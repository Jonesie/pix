# Standalone run: builds and starts pix on its own, bind-mounting ./data
# for images/video and the SQLite DB. Put a reverse proxy (see nginx/) in
# front of it for a real domain and HTTPS.
services:
  pix:
    build: .
    image: pix:local
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
